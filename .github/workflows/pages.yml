name: Deploy MyKeebStudio

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build RMK Rynk wasm
        run: |
          git clone https://github.com/rmk-rs/rmk.git .rmk
          git -C .rmk checkout 4ceff5eec277671ce4f62e4d54e25a9b1b12ef04
          mkdir -p public/rynk-wasm
          wasm-pack build .rmk/rynk/rynk-wasm --target web --out-dir "$GITHUB_WORKSPACE/public/rynk-wasm"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
